[package]
name = "agent-runner-opencode"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "agent-runner-opencode"
path = "src/main.rs"

[lib]
name = "agent_runner_opencode"
path = "src/lib.rs"

[features]
default = []
contract-test-fixtures = []

[[test]]
name = "contract_launch_policy_terminal"
path = "tests/contract_launch_policy_terminal.rs"
required-features = ["contract-test-fixtures"]

[[test]]
name = "contract_session_projection"
path = "tests/contract_session_projection.rs"
required-features = ["contract-test-fixtures"]

[[test]]
name = "contract_quota_auth"
path = "tests/contract_quota_auth.rs"
required-features = ["contract-test-fixtures"]

[[test]]
name = "contract_control_plane_lifecycle"
path = "tests/contract_control_plane_lifecycle.rs"
required-features = ["contract-test-fixtures"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
tempfile = "3"
toml = "0.8"
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[dev-dependencies]
base64 = "0.22"
jsonschema = { version = "0.18", features = ["draft202012"] }
